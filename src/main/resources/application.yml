server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: dish_memo

spring:
  application:
    name: cook-history-service
  datasource:
    url: jdbc:mysql://${DB_ADDRESS:localhost:3306}/${DB_SCHEMA:dish_memo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Hong_Kong
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX

mybatis:
  configuration:
    map-underscore-to-camel-case: true

dish-memo:
  suggestion:
    image-url-allowed-hosts: ${SUGGESTION_IMAGE_URL_ALLOWED_HOSTS:localhost,127.0.0.1}
    bailian:
      api-key: ${BAILIAN_API_KEY:}
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${BAILIAN_MODEL:qwen3.6-flash}
      connect-timeout: ${BAILIAN_CONNECT_TIMEOUT:3s}
      read-timeout: ${BAILIAN_READ_TIMEOUT:30s}
  logging:
    slow-request-threshold-ms: 1000
