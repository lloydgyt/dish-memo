server:
  port: ${SERVER_PORT}

spring:
  application:
    name: cook-history-service
  datasource:
    url: jdbc:mysql://${DB_ADDRESS}/dish_memo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Hong_Kong
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  upload:
    base-dir: ${UPLOAD_BASE_DIR}
    public-prefix: ${UPLOAD_PUBLIC_PREFIX}
