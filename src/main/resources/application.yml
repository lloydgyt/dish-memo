server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cook-history-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dish_memo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:545426}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Hong_Kong
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  upload:
    base-dir: "uploads"
    public-prefix: "http://localhost:8080/uploads"
