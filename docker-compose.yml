services:
  backend:
    image: cook-history-service-1.0.0
    container_name: cook-history-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    volumes:
      # must sync with LOG_PATH
      - ./logs:/app/logs
    environment:
      SERVER_PORT: 8080
      DB_ADDRESS: mysql:3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: dish_memo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      LOG_PATH: /app/logs

      HIKARI_MAX_POOL_SIZE: 10
      TOMCAT_MAX_THREADS: 10
      TOMCAT_MIN_THREADS: 10
      SLOW_LOG_THRESH_MS: 1000

  mysql:
    image: mysql:latest
    container_name: dish-memo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: dish_memo
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/data:/var/lib/mysql
    ports:
      - "3306:3306"
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=+08:00",

        # 开启慢查询
        "--slow-query-log=ON",
        "--slow-query-log-file=/var/lib/mysql/slow.log",
        "--long-query-time=1",
        "--log-queries-not-using-indexes=OFF"
      ]
  redis:
    image: redis:latest
    container_name: dish-memo-redis
    restart: unless-stopped
    command:
      ["redis-server"]